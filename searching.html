<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ALVIA searching algorithm visualizer." />
  <title>ALVIA — Searching</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="workspace-page">
  <header class="workspace-header">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="" />
      <span>ALVIA</span>
    </a>
    <span class="crumb">/ Searching</span>
    <a class="back-link" href="index.html">← Back</a>
  </header>

  <main class="workspace">
    <aside class="algorithm-sidebar">
      <p class="sidebar-label">SEARCH ALGORITHMS</p>
      <button class="algorithm-option active" data-algorithm="linear">Linear Search</button>
      <button class="algorithm-option" data-algorithm="binary">Binary Search</button>
    </aside>

    <section class="visualizer-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">SEARCHING</p>
          <h1 id="algorithmTitle">Linear Search</h1>
          <p id="algorithmDescription">Checks each element one by one until the target is found.</p>
        </div>
      </div>

      <div class="target-row card">
        <label for="targetInput">Target element</label>
        <input id="targetInput" type="number" value="25" inputmode="numeric" />
        <span id="targetStatus" class="status-text">Ready to search</span>
      </div>

      <div class="chart-card">
        <div id="searchBars" class="bars" aria-label="Searching visualization"></div>
      </div>

      <div class="control-row">
        <button id="playButton" class="primary-button control-button">▶ <span>Play</span></button>
        <button id="resetButton" class="secondary-button control-button">↻ Reset</button>
        <label class="speed-control">
          <span>Speed</span>
          <output id="speedValue">100ms</output>
          <input id="speedSlider" type="range" min="30" max="700" step="10" value="100" />
        </label>
      </div>

      <section class="array-controls card">
        <div class="section-title-row">
          <div>
            <p class="eyebrow">ARRAY CONTROLS</p>
            <h2>Shape your input</h2>
          </div>
          <div class="count-control">
            <span>Elements</span>
            <button id="decreaseCount" aria-label="Remove an element">−</button>
            <output id="elementCount">14</output>
            <button id="increaseCount" aria-label="Add an element">+</button>
          </div>
        </div>

        <div class="button-row">
          <button id="addButton" class="secondary-button">＋ Add Element</button>
          <button id="randomButton" class="secondary-button">⤨ Randomize</button>
          <button id="pushButton" class="secondary-button">↓ Push</button>
          <button id="popButton" class="secondary-button danger-button">⌫ Pop</button>
        </div>

        <p class="helper-text">For Binary Search, ALVIA sorts a working copy automatically before searching.</p>
        <div id="arrayEditor" class="array-editor"></div>
      </section>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/searching.js"></script>
</body>
</html>
