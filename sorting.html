<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ALVIA sorting algorithm visualizer." />
  <title>ALVIA — Sorting</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="workspace-page">
  <header class="workspace-header">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="" />
      <span>ALVIA</span>
    </a>
    <span class="crumb">/ Sorting</span>
    <a class="back-link" href="index.html">← Back</a>
  </header>

  <main class="workspace">
    <aside class="algorithm-sidebar">
      <p class="sidebar-label">SORTING ALGORITHMS</p>
      <button class="algorithm-option active" data-algorithm="bubble">Bubble Sort</button>
      <button class="algorithm-option" data-algorithm="insertion">Insertion Sort</button>
      <button class="algorithm-option" data-algorithm="selection">Selection Sort</button>
      <button class="algorithm-option" data-algorithm="merge">Merge Sort</button>
      <button class="algorithm-option" data-algorithm="quick">Quick Sort</button>
    </aside>

    <section class="visualizer-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">SORTING</p>
          <h1 id="algorithmTitle">Bubble Sort</h1>
          <p id="algorithmDescription">Repeatedly compares adjacent elements and swaps them when they are in the wrong order.</p>
        </div>
      </div>

      <div class="chart-card">
        <div id="sortingBars" class="bars" aria-label="Sorting visualization"></div>
      </div>

      <div class="control-row">
        <button id="playButton" class="primary-button control-button">▶ <span>Play</span></button>
        <button id="resetButton" class="secondary-button control-button">↻ Reset</button>
        <label class="speed-control">
          <span>Speed</span>
          <output id="speedValue">100ms</output>
          <input id="speedSlider" type="range" min="30" max="700" step="10" value="100" />
        </label>
      </div>

      <section class="array-controls card">
        <div class="section-title-row">
          <div>
            <p class="eyebrow">ARRAY CONTROLS</p>
            <h2>Shape your input</h2>
          </div>
          <div class="count-control">
            <span>Elements</span>
            <button id="decreaseCount" aria-label="Remove an element">−</button>
            <output id="elementCount">14</output>
            <button id="increaseCount" aria-label="Add an element">+</button>
          </div>
        </div>

        <div class="button-row">
          <button id="addButton" class="secondary-button">＋ Add Element</button>
          <button id="randomButton" class="secondary-button">⤨ Randomize</button>
          <button id="pushButton" class="secondary-button">↓ Push</button>
          <button id="popButton" class="secondary-button danger-button">⌫ Pop</button>
        </div>

        <p class="helper-text">Edit each value with the − / + controls. Changes apply before the next run.</p>
        <div id="arrayEditor" class="array-editor"></div>
      </section>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/sorting.js"></script>
</body>
</html>
